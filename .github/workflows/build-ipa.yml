# 在 GitHub 的 Mac 云电脑上自动编译，产出未签名的 PhotoCleaner.ipa
# 用法：推送代码到 GitHub → 仓库的 Actions 页 → Build IPA → Run workflow → 运行完成后在页面底部 Artifacts 下载
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/promo-capture.yml'
      - '.github/promo/**'
      - 'PhotoCleanerPromoUITests/**'
      - 'PhotoCleanerUITests/**'
      - '.github/verify/**'
      - '.github/workflows/ui-verify.yml'

# 连续推送时只保留最新的一次构建
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 液态玻璃（.glassEffect 等）需要 iOS 26 SDK → 用 macOS 26 + 最新正式版 Xcode（26.x）
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择最新正式版 Xcode（含 iOS 26 SDK）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 确认 iOS SDK ≥ 26
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "需要 iOS 26 SDK 才能编译液态玻璃 API"; exit 1; }

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: 单元测试（模拟器，失败则整个构建失败）
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project PhotoCleaner.xcodeproj \
            -scheme PhotoCleaner \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/test.log" 2>&1 \
            || { grep -E "error:|failed|FAILED|Fatal" "$RUNNER_TEMP/test.log" | head -40 | sed 's/^/::error::/'; tail -80 "$RUNNER_TEMP/test.log"; exit 1; }
          grep -E "Executed|passed|TEST SUCCEEDED" "$RUNNER_TEMP/test.log" | tail -10

      - name: 编译归档（不签名）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PhotoCleaner.xcodeproj \
            -scheme PhotoCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PhotoCleaner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/archive.log" | head -40 | sed 's/^/::error::/'; tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/archive.log"

      - name: 打包成 IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/PhotoCleaner.xcarchive/Products/Applications/PhotoCleaner.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry PhotoCleaner-unsigned.ipa Payload
          codesign -dv --verbose=2 Payload/PhotoCleaner.app || true
          ls Payload/PhotoCleaner.app/PlugIns || true
          ls -lh PhotoCleaner-unsigned.ipa
          # 备用：去掉小组件的版本（如果侧载时小组件导致装不上，就装这个）
          mkdir -p "$RUNNER_TEMP/ipa-nowidget"
          cp -R Payload "$RUNNER_TEMP/ipa-nowidget/"
          rm -rf "$RUNNER_TEMP/ipa-nowidget/Payload/PhotoCleaner.app/PlugIns"
          cd "$RUNNER_TEMP/ipa-nowidget"
          zip -qry PhotoCleaner-unsigned-nowidget.ipa Payload
          ls -lh PhotoCleaner-unsigned-nowidget.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCleaner-unsigned-ipa
          path: ${{ runner.temp }}/ipa/PhotoCleaner-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传无小组件版 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCleaner-unsigned-nowidget-ipa
          path: ${{ runner.temp }}/ipa-nowidget/PhotoCleaner-unsigned-nowidget.ipa
          retention-days: 30

      - name: 导出待翻译文字（xliff）
        continue-on-error: true
        run: |
          xcodebuild -exportLocalizations \
            -project PhotoCleaner.xcodeproj \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage en \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/loc.log" 2>&1 || tail -40 "$RUNNER_TEMP/loc.log"
          find "$RUNNER_TEMP/loc" -name "*.xliff" | head

      - name: 上传 xliff
        uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: ${{ runner.temp }}/loc
          if-no-files-found: ignore
          retention-days: 7
