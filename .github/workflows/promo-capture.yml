# 宣传视频素材：在模拟器里装 App、放入示例照片、自动截图/录屏（只手动运行，不影响 Build IPA / Build APK）
name: Promo Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promo-capture.yml'
      - '.github/promo/**'
      - 'PhotoCleanerPromoUITests/**'

concurrency:
  group: promo-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: 选模拟器
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          import re
          num=lambda x:int((re.findall(r'\d+',x['name']) or ['0'])[0])
          pm=sorted([x for x in c if 'Pro Max' in x['name']],key=num)
          pick=(pm or sorted(c,key=num))[-1]
          print(pick['name'],file=sys.stderr)
          print(pick['udid'])")
          xcrun simctl list devices | grep "$UDID" | tee "$RUNNER_TEMP/device.txt"
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: 模拟器设为简体中文
        run: |
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array zh-Hans || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string zh_CN || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: 编译（App + 宣传用 UI 自动化）
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PhotoCleaner.xcodeproj -scheme PromoCapture \
            -destination "id=$UDID" -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name PhotoCleaner.app | head -1)" >> $GITHUB_ENV
      - name: 示例照片
        run: |
          python3 -m pip install --break-system-packages -q pillow piexif qrcode || python3 -m pip install -q pillow piexif qrcode
          python3 .github/promo/make_media.py "$RUNNER_TEMP/media"
          xcrun simctl addmedia "$UDID" "$RUNNER_TEMP"/media/*.jpg
      - name: 自动操作、截图与录屏
        run: |
          set -x
          S="$RUNNER_TEMP/shots"; mkdir -p "$S"; cp "$RUNNER_TEMP/device.txt" "$S/" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant photos com.yeyuanye.photocleaner || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$S/run.mp4" & REC=$!
          sleep 3
          python3 -c "import time;print(time.time())" > "$S/rec_start.txt"
          export TEST_RUNNER_PROMO_SHOTS="$S"
          xcodebuild test-without-building -project PhotoCleaner.xcodeproj -scheme PromoCapture \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/r.xcresult" > "$RUNNER_TEMP/test.log" 2>&1 || tail -80 "$RUNNER_TEMP/test.log"
          kill -INT $REC; wait $REC || true
          cp "$RUNNER_TEMP/test.log" "$S/" || true
          ls -la "$S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-shots
          path: ${{ runner.temp }}/shots
          retention-days: 14
