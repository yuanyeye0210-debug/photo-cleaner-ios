# 宣传视频素材：在模拟器里装 App、放入示例照片、自动截图/录屏（只手动运行，不影响 Build IPA / Build APK）
name: Promo Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promo-capture.yml'
      - '.github/promo/**'

concurrency:
  group: promo-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: 选模拟器
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pref=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]
          print((pref or c)[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: 编译模拟器版
        run: |
          set -o pipefail
          xcodebuild build -project PhotoCleaner.xcodeproj -scheme PhotoCleaner \
            -destination "id=$UDID" -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name PhotoCleaner.app | head -1)" >> $GITHUB_ENV
      - name: 示例照片
        run: |
          python3 -m pip install --break-system-packages -q pillow piexif qrcode || python3 -m pip install -q pillow piexif qrcode
          python3 .github/promo/make_media.py "$RUNNER_TEMP/media"
          xcrun simctl addmedia "$UDID" "$RUNNER_TEMP"/media/*.jpg
      - name: 截图与录屏
        run: |
          set -x
          S="$RUNNER_TEMP/shots"; mkdir -p "$S"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant photos com.yeyuanye.photocleaner || true
          xcrun simctl privacy "$UDID" grant photos-add com.yeyuanye.photocleaner || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$S/launch.mp4" & REC=$!
          sleep 2
          xcrun simctl launch "$UDID" com.yeyuanye.photocleaner
          sleep 6;  xcrun simctl io "$UDID" screenshot "$S/00-home-scanning.png"
          sleep 50; xcrun simctl io "$UDID" screenshot "$S/01-home.png"
          kill -INT $REC; wait $REC || true
          shot() { xcrun simctl openurl "$UDID" "$1"; sleep "${3:-5}"; xcrun simctl io "$UDID" screenshot "$S/$2.png"; }
          for c in similar exactDuplicates bursts screenshots textImages documents qrCodes lowQuality blurry poorLight livePhotos large videos food pets scenery; do
            shot "photocleaner://category/$c" "cat-$c" 5
            shot "photocleaner://home" "_home-after-$c" 2
          done
          shot "photocleaner://quick/onThisDay" "quick-onThisDay" 5
          shot "photocleaner://home" "_h1" 2
          shot "photocleaner://quick/random" "quick-random" 5
          shot "photocleaner://review" "review" 4
          shot "photocleaner://home" "02-home-final" 3
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$S/nav.mp4" & REC=$!
          sleep 2
          shot "photocleaner://category/blurry" "_v1" 4
          shot "photocleaner://home" "_v2" 3
          shot "photocleaner://category/similar" "_v3" 4
          kill -INT $REC; wait $REC || true
          ls -la "$S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-shots
          path: ${{ runner.temp }}/shots
          retention-days: 14
