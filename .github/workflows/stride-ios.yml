name: build-stride-ipa

# 版本规则：每次构建 = 一个新版本（1.0.<run_number>）
#   1. 编译 → 产出 Stride-1.0.N.ipa
#   2. 发布到 Releases（tag: stride-v1.0.N）
#   3. 只保留最新 2 个版本（当前 + 上一版备份），更早的自动删掉（含 tag）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stride-app/**'
      - '.github/workflows/stride-ios.yml'

permissions:
  contents: write

env:
  KEEP_RELEASES: 2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: stride-app/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: v
        run: |
          N='${{ github.run_number }}'
          echo "marketing=1.0.$N" >> "$GITHUB_OUTPUT"
          echo "build=$N" >> "$GITHUB_OUTPUT"
          echo "tag=stride-v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "版本：1.0.$N"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP" || { echo "找不到 $APP"; ls -R build/Build/Products | head -60; exit 1; }
          rm -rf Payload Stride-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Stride-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp Stride-unsigned.ipa "$GITHUB_WORKSPACE/dist/Stride-${{ steps.v.outputs.marketing }}.ipa"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.v.outputs.tag }}'
          VER='${{ steps.v.outputs.marketing }}'
          IPA="$GITHUB_WORKSPACE/dist/Stride-$VER.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在（重跑），覆盖产物"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Stride $VER" \
              --notes "自动构建 #${{ github.run_number }} · ${{ github.sha }}
          未签名 IPA，用 Sideloadly 以 Apple ID 签名后安装。
          免费账号 7 天有效，到期重新签一次即可。"
          fi

      - name: Prune old releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("stride-v"))] | sort_by(.createdAt) | reverse | .[].tagName')
          echo "现有 Stride 版本（新→旧）："
          echo "$TAGS"
          i=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            i=$((i+1))
            if [ "$i" -gt "$KEEP_RELEASES" ]; then
              echo "删除旧版本：$t"
              gh release delete "$t" --yes --cleanup-tag || echo "  删除失败（忽略）"
            fi
          done <<< "$TAGS"
          echo "--- 清理后 ---"
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("stride-v"))] | sort_by(.createdAt) | reverse | .[].tagName'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stride-ipa-${{ steps.v.outputs.marketing }}
          path: dist/Stride-${{ steps.v.outputs.marketing }}.ipa
          retention-days: 7
          if-no-files-found: error
