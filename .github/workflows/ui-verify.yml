# 上线前自检：在最新的 Pro Max 模拟器里装 App、放入示例照片，自动点一遍主要页面并截图检查
# 检查不通过（界面重复、照片没显示、照片溢出卡片）时流程变红；截图在 Artifacts「ui-verify-shots」
name: UI Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PhotoCleaner/**'
      - 'PhotoCleanerUITests/**'
      - 'project.yml'
      - '.github/verify/**'
      - '.github/workflows/ui-verify.yml'

concurrency:
  group: ui-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: 选模拟器（最新的 Pro Max）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json,re
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          num=lambda x:int((re.findall(r'\d+',x['name']) or ['0'])[0])
          pm=sorted([x for x in c if 'Pro Max' in x['name']],key=num)
          pick=(pm or sorted(c,key=num))[-1]
          print(pick['name'],file=sys.stderr)
          print(pick['udid'])")
          xcrun simctl list devices | grep "$UDID" | tee "$RUNNER_TEMP/device.txt"
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array zh-Hans || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string zh_CN || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: 编译（App + 自检 UI 测试）
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PhotoCleaner.xcodeproj -scheme UIVerify \
            -destination "id=$UDID" -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -40; tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name PhotoCleaner.app | head -1)" >> $GITHUB_ENV
      - name: 示例照片
        run: |
          python3 -m pip install --break-system-packages -q pillow piexif qrcode || python3 -m pip install -q pillow piexif qrcode
          python3 .github/verify/make_media.py "$RUNNER_TEMP/media"
          xcrun simctl addmedia "$UDID" "$RUNNER_TEMP"/media/*.jpg
      - name: 自动操作、截图、检查
        run: |
          S="$RUNNER_TEMP/shots"; mkdir -p "$S"; cp "$RUNNER_TEMP/device.txt" "$S/" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant photos com.yeyuanye.photocleaner || true
          export TEST_RUNNER_VERIFY_SHOTS="$S"
          set +e
          xcodebuild test-without-building -project PhotoCleaner.xcodeproj -scheme UIVerify \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/r.xcresult" > "$RUNNER_TEMP/test.log" 2>&1
          CODE=$?
          cp "$RUNNER_TEMP/test.log" "$S/" || true
          grep -E "VERIFY:|error:|Executed" "$RUNNER_TEMP/test.log" | tail -80
          ls -la "$S"
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verify-shots
          path: ${{ runner.temp }}/shots
          retention-days: 14
