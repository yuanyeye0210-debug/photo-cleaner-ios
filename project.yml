# XcodeGen 配置（项目的唯一来源）。生成 Xcode 工程：xcodegen generate
name: PhotoCleaner
options:
  bundleIdPrefix: com.yeyuanye
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 让编译器提取 String(localized:)、Text 等里的文字，供 Localizable.xcstrings 翻译
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources:
      - path: PhotoCleaner
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyuanye.photocleaner
        PRODUCT_NAME: PhotoCleaner
        INFOPLIST_FILE: PhotoCleaner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: PhotoCleanerWidget
        embed: true
  # 桌面小组件（iOS 17+）。不加 App Group 权限，免费 Apple ID 侧载也能装；数字直接用 PhotoKit 读
  PhotoCleanerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoCleanerWidget
        excludes:
          - Info.plist
      - path: PhotoCleaner/Core/CleanLogic.swift
    info:
      path: PhotoCleanerWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: 相册清理
        CFBundleLocalizations: [zh-Hans, en]
        NSPhotoLibraryUsageDescription: 小组件需要读取相册里的截图数量和往年今天的照片数量，只在手机本地统计。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyuanye.photocleaner.widget
        PRODUCT_NAME: PhotoCleanerWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  PhotoCleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoCleanerTests
    dependencies:
      - target: PhotoCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyuanye.photocleaner.tests
        GENERATE_INFOPLIST_FILE: YES
  # 宣传视频素材用的 UI 自动化（只在 Promo Capture 流程里跑，不在 PhotoCleaner 方案里）
  PhotoCleanerPromoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhotoCleanerPromoUITests
    dependencies:
      - target: PhotoCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyuanye.photocleaner.promouitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoCleaner
schemes:
  PhotoCleaner:
    build:
      targets:
        PhotoCleaner: all
        PhotoCleanerTests: [test]
    test:
      targets:
        - PhotoCleanerTests
  PromoCapture:
    build:
      targets:
        PhotoCleaner: all
        PhotoCleanerPromoUITests: [test]
    test:
      targets:
        - PhotoCleanerPromoUITests
