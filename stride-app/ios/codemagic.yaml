workflows:
  ios-unsigned:
    name: Stride unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: Stride
        PROJECT: Stride.xcodeproj
    scripts:
      - name: Build (unsigned)
        script: |
          set -e
          xcodebuild -version
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: Package IPA
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP"
          rm -rf Payload Stride-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Stride-unsigned.ipa Payload
          ls -lh Stride-unsigned.ipa
    artifacts:
      - Stride-unsigned.ipa
